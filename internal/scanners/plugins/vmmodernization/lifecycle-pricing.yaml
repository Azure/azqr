# This file is a manually curated, dated reference dataset — not auto-generated.
# It encodes the user-supplied VM lifecycle/pricing change table as its own
# auditable record, separate from live Azure Resource Graph data (plan decision D2).
#
# An empty `families` list means the row applies broadly (not to a specific VM
# family) and is always surfaced as a general notice. `excludeFamilies` removes
# otherwise-matching families from a row's match set (including from an empty
# `families` row), so a broad row can state "every family except these"
# without an exhaustive explicit allow-list.
#
# An empty `regions` list means the row applies to all Azure regions. A
# non-empty `regions` list restricts the row to only those regions (lowercase,
# no spaces, matching the ARG `location` value, for example "westeurope").
#
# The region-scoped price-increase rows exclude both the v7 families (exempt
# from any uplift) and the v1/v2 families (which take the separate 25 percent
# increase instead, per the field alert's "do not double-count" rule) via
# `excludeFamilies`, so a v1/v2 SKU in an affected region reports only the 25
# percent note, not also a regional percentage note.
